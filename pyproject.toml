[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "search-budget"
version = "1.0.0"
description = "The search budget of the BSM resonance program: trials factors, the discovery bar, and how a scan of that size is best run"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "RODEM, Universite de Geneve"}]
dependencies = []

[project.optional-dependencies]
figures = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.6"]
dev = ["pytest>=7.0"]

[project.scripts]
search-budget = "searchbudget.cli:main"

[project.urls]
Homepage = "https://github.com/rodem-hep/search-budget"

[tool.setuptools.packages.find]
include = ["searchbudget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
